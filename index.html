<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPX Compass / Rally Navi RG</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2933;
      --muted: #5f6f7f;
      --line: #d7dee8;
      --accent: #0f6bff;
      --bg: #f7f9fc;
      --panel: #ffffff;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>GPX Compass / Rally Navi RG</h1>
      <p>GPXルートを見ながら走行するためのナビゲーション補助アプリです。</p>
      <p><a href="/privacy-policy/">プライバシーポリシー</a></p>
    </section>
  </main>
</body>
</html>
